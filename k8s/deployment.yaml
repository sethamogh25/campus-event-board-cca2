apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-event-board
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-event-board
  template:
    metadata:
      labels:
        app: campus-event-board
    spec:
      containers:
        - name: campus-event-board
          image: amoghseth25/campus-event-board:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "1"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
